[project]
name = "server"
version = "1.0.0"
description = "Add your description here"
requires-python = ">=3.13,<4.0"
dependencies = [
    "alembic>=1.18.3",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.128.6",
    "greenlet>=3.3.1",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0.46",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
    "taskipy>=1.14.1",
    "basedpyright>=1.34.0",
    "pre-commit>=4.3.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv", ".ruff_cache", "__pycache__", ".pytest_cache", ".mypy_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=server --cov-report=term-missing"

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["server"]
exclude = [".venv", ".ruff_cache", "**/__pycache__"]
reportMissingTypeStubs = "none"
venvPath = "."
venv = ".venv"

[tool.taskipy.tasks]
lint = "ruff check ."
lint_fix = "ruff check . --fix"
format = "ruff format ."
typecheck = "basedpyright"
test = "pytest -ra --cov=server --cov-report=term-missing"
check = "task lint && task typecheck && task test"
run = "fastapi dev server/main.py"
